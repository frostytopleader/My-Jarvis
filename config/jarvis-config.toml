[channels.twilio]
enabled = true
account_sid = "${TWILIO_ACCOUNT_SID}"
phone_number = "${TWILIO_PHONE_NUMBER}"

[speech]
tts_backend = "elevenlabs"
voice_id = "JBFqnCBsd6RMkjVDRZzb"
model = "eleven_multilingual_v2"
output_format = "mp3"

[server]
host = "0.0.0.0"
port = 8000

[server.auth]
api_key = "${OPENJARVIS_API_KEY}"

[tools.storage]
default_backend = "sqlite"
db_path = "~/.openjarvis/memory.db"

[memory]
enabled = true
backend = "local"
max_facts = 1000

[tools.mcp]
enabled = true
servers = '[{"name":"osiris","url":"http://127.0.0.1:8002"},{"name":"tools","url":"http://127.0.0.1:8003"},{"name":"playwright","command":"npx","args":["@playwright/mcp@latest","--headless"]}]'

[telemetry]
enabled = false

[traces]
enabled = true
db_path = "~/.openjarvis/traces.db"
