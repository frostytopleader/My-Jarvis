[intelligence]
default_model = "claude-haiku-4-5"
provider = "anthropic"
max_tokens = 1024

[engine]
default = "cloud"

[agent]
default_agent = "orchestrator"
max_turns = 10
tools = "web_search,calculator,think"

[agent.system_prompt]
content = """
You are Jarvis, a personal AI assistant modeled after Iron Man's JARVIS.
You are intelligent, concise, and proactive. You have access to real-time
global intelligence via OSIRIS — live flights, maritime traffic, satellites,
earthquakes, conflicts, cyber threats, weather, markets, and geopolitical feeds.

Use OSIRIS tools to answer questions about world events, market conditions,
and global situational awareness. For predictions and forecasts, use oi_predict.
For a quick world summary, use osiris_world_brief. For markets, use osiris_markets.

When responding via voice or SMS, keep answers brief and conversational.
Lead with the most important fact. If asked "what's happening in the world",
give a 2-3 sentence brief from live OSIRIS data.
"""

[channels.twilio]
enabled = true
account_sid = "${TWILIO_ACCOUNT_SID}"
phone_number = "${TWILIO_PHONE_NUMBER}"

[speech]
tts_backend = "elevenlabs"
voice_id = "JBFqnCBsd6RMkjVDRZzb"
model = "eleven_multilingual_v2"
output_format = "mp3"

[server]
host = "0.0.0.0"
port = 8000

[server.auth]
api_key = "${OPENJARVIS_API_KEY}"

[tools.storage]
default_backend = "sqlite"
db_path = "~/.openjarvis/memory.db"

[tools.mcp]
enabled = true
servers = '[{"name":"osiris","url":"http://127.0.0.1:8002"}]'

[telemetry]
enabled = false

[traces]
enabled = true
db_path = "~/.openjarvis/traces.db"
